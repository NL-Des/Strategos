# Strategos : une seule commande, `docker compose up` (architecture.md §7).
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HSTS: ${HSTS:-max-age=31536000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Fuseau des tâches planifiées (sauvegarde de 3 h) et des dates des journaux.
      TZ: ${TZ:-Europe/Paris}
      # Origines autorisées pour les requêtes qui modifient des données (CSRF).
      APP_ORIGINS: https://${DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-strategos}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est à définir dans .env (voir .env.example)}@db:5432/${POSTGRES_DB:-strategos}
      UPLOADS_DIR: /data/uploads
      BACKUPS_DIR: /data/backups
      # Google Sheets : les identifiants Google se saisissent dans Admin › Sources, sauf si
      # l'installateur les fournit ici (ils ont alors priorité ; voir .env.example).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_REDIRECT_URI: https://${DOMAIN:-localhost}/api/v1/google/callback
      # OneDrive : application Azure (voir .env.example).
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT: ${AZURE_TENANT:-common}
      AZURE_REDIRECT_URI: https://${DOMAIN:-localhost}/api/v1/onedrive/callback
      # Clé de chiffrement des secrets en base : facultative, créée dans le volume `keys` sinon.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      KEYS_DIR: /data/keys
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Plafonds (voir .env.example) : vides, le backend applique ses valeurs par défaut.
      WS_MAX_PAYLOAD_KB: ${WS_MAX_PAYLOAD_KB:-}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-}
      WS_MESSAGES_PER_10S: ${WS_MESSAGES_PER_10S:-}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strategos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est à définir dans .env (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-strategos}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
  backups:
  keys:
  caddy_data:
  caddy_config:
