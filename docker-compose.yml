# Strategos : une seule commande, `docker compose up` (architecture.md §7).
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Fuseau des tâches planifiées (sauvegarde de 3 h) et des dates des journaux.
      TZ: ${TZ:-Europe/Paris}
      # Origines autorisées pour les requêtes qui modifient des données (CSRF).
      APP_ORIGINS: https://${DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-strategos}:${POSTGRES_PASSWORD:-strategos}@db:5432/${POSTGRES_DB:-strategos}
      UPLOADS_DIR: /data/uploads
      BACKUPS_DIR: /data/backups
      # Google Sheets : clé du compte de service, fichier secret monté (jamais dans l'image).
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/strategos/google-service-account.json
      # OneDrive : application Azure et clé de chiffrement du jeton (voir .env.example).
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT: ${AZURE_TENANT:-common}
      AZURE_REDIRECT_URI: https://${DOMAIN:-localhost}/api/v1/onedrive/callback
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
      # Secrets du déploiement (dossier ignoré par git) ; sans clé, Google Sheets est désactivé.
      - ./secrets:/run/secrets/strategos:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strategos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strategos}
      POSTGRES_DB: ${POSTGRES_DB:-strategos}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
