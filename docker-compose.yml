# Strategos : une seule commande, `docker compose up` (architecture.md §7).
#
# Cloisonnement (bilan-securite.md, M6) : système de fichiers en lecture seule, aucune
# capacité Linux hors celles citées, pas d'élévation de privilèges, et deux réseaux :
# `front` (proxy, frontend, backend) et `back` (backend, base). Le proxy et le frontend
# ne peuvent pas joindre la base.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 200
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Écoute sur les ports 80 et 443.
    cap_add: [NET_BIND_SERVICE]
    networks: [front]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HSTS: ${HSTS:-max-age=31536000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 100
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/data, /config]
    networks: [front]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    # Plafonds : un conteneur emballé ne prend pas toute la machine (2 Go conseillés).
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    pids_limit: 300
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Dossier de travail des sauvegardes et des restaurations.
    tmpfs: [/tmp]
    networks: [front, back]
    environment:
      NODE_ENV: production
      PORT: 3000
      # Fuseau des tâches planifiées (sauvegarde de 3 h) et des dates des journaux.
      TZ: ${TZ:-Europe/Paris}
      # Origines autorisées pour les requêtes qui modifient des données (CSRF).
      APP_ORIGINS: https://${DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-strategos}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est à définir dans .env (voir .env.example)}@db:5432/${POSTGRES_DB:-strategos}
      UPLOADS_DIR: /data/uploads
      BACKUPS_DIR: /data/backups
      # Google Sheets : les identifiants Google se saisissent dans Admin › Sources, sauf si
      # l'installateur les fournit ici (ils ont alors priorité ; voir .env.example).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_REDIRECT_URI: https://${DOMAIN:-localhost}/api/v1/google/callback
      # OneDrive : application Azure (voir .env.example).
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT: ${AZURE_TENANT:-common}
      AZURE_REDIRECT_URI: https://${DOMAIN:-localhost}/api/v1/onedrive/callback
      # Clé de chiffrement des secrets en base : facultative, créée dans le volume `keys` sinon.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      KEYS_DIR: /data/keys
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Plafonds (voir .env.example) : vides, le backend applique ses valeurs par défaut.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      ATTACHMENT_PENDING_QUOTA_MB: ${ATTACHMENT_PENDING_QUOTA_MB:-}
      XLSX_MAX_UNCOMPRESSED_MB: ${XLSX_MAX_UNCOMPRESSED_MB:-}
      WS_MAX_PAYLOAD_KB: ${WS_MAX_PAYLOAD_KB:-}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-}
      WS_MESSAGES_PER_10S: ${WS_MESSAGES_PER_10S:-}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy
      volumes-init:
        condition: service_completed_successfully

  # Donne les volumes du backend à son utilisateur (`node`), puis s'arrête. Nécessaire pour
  # une installation dont les volumes ont été créés quand le backend tournait en root.
  volumes-init:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    user: root
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    command: ['chown', '-R', 'node:node', '/data/uploads', '/data/backups', '/data/keys']
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
      - keys:/data/keys

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 200
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # Ce que demande le démarrage de l'image : prise de propriété du dossier de données,
    # puis passage à l'utilisateur `postgres`.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [back]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strategos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est à définir dans .env (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-strategos}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  front:
  back:

volumes:
  db_data:
  uploads:
  backups:
  keys:
  caddy_data:
  caddy_config:
