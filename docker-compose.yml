# Strategos : une seule commande, `docker compose up` (architecture.md §7).
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Origines autorisées pour les requêtes qui modifient des données (CSRF).
      APP_ORIGINS: https://${DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-strategos}:${POSTGRES_PASSWORD:-strategos}@db:5432/${POSTGRES_DB:-strategos}
      UPLOADS_DIR: /data/uploads
      BACKUPS_DIR: /data/backups
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strategos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strategos}
      POSTGRES_DB: ${POSTGRES_DB:-strategos}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
